<template>
    <lightning-card title="Available Time Slots">
        <div class="slds-p-around_medium">
            <div class="controls slds-m-bottom_small">
                <lightning-input type="date"
                                 label="Select date"
                                 value={selectedDateISO}
                                 onchange={handleDateChange}>
                </lightning-input>
                <lightning-button variant="neutral" label="This Week" onclick={handleTodayWeek} class="slds-m-left_small"></lightning-button>
            </div>

            <template if:true={loading}>
                <div>Loading...</div>
            </template>

            <template if:false={loading}>
                <div class="grid-container">
                    <div class="grid-header slds-grid">
                        <div class="time-cell col slds-size_2-of-12 slds-p-around_x-small"></div>
                        <template for:each={weekDays} for:item="dayObj">
                            <div key={dayObj.iso} class="col slds-size_2-of-12 slds-p-around_x-small">
                                <strong>{dayObj.label}</strong>
                                <div class="slds-text-color_weak">{dayObj.iso}</div>
                            </div>
                        </template>
                    </div>

                    <div class="grid-body">
                        <template for:each={timeslotsMap} for:item="timeRow">
                            <div key={timeRow.label} class="grid-row slds-grid">
                                <div class="time-cell col slds-size_2-of-12 slds-p-around_x-small">{timeRow.label}</div>
                                <template for:each={timeRow.slots} for:item="dayObj">
                                    <div key={dayObj.label} class="col slds-size_2-of-12 slds-p-around_x-small cell">
                                        <template if:true={dayObj.id}>
                                            <button class="slds-button slds-button_neutral slot-button"
                                                    data-slot-id={dayObj.id}
                                                    data-day={dayObj.day}
                                                    data-time-row={timeRow.label}
                                                    data-available={dayObj.numberAvailable}
                                                    onclick={handleSelect}>
                                                <div class="slot-time">{dayObj.label}</div>
                                                <div class="slot-qty">
                                                    <template if:true={dayObj.numberAvailable}>
                                                        {dayObj.numberAvailable} available
                                                    </template>
                                                    <template if:false={dayObj.numberAvailable}>
                                                        Unavailable
                                                    </template>
                                                </div>
                                                <template if:true={dayObj.agentName}>
                                                    <div class="slot-agent">Agent: {dayObj.agentName}</div>
                                                </template>
                                            </button>
                                        </template>
                                        <template if:false={dayObj.id}>
                                            <div class="slds-text-color_weak slds-text-align_center">No slots</div>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>
    </lightning-card>

    <!-- Booking Modal -->
    <template if:true={showBookingModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_medium" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleCloseModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">Confirm Booking</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <template if:true={selectedSlot}>
                        <div class="slds-grid slds-grid_vertical slds-gutters">
                            <div class="slds-col">
                                <dl class="slds-list_horizontal slds-wrap">
                                    <dt class="slds-item_label slds-text-color_weak slds-truncate" title="Date">Date:</dt>
                                    <dd class="slds-item_detail slds-truncate"><strong>{selectedSlot.dayLabel}</strong></dd>
                                </dl>
                            </div>
                            <div class="slds-col">
                                <dl class="slds-list_horizontal slds-wrap">
                                    <dt class="slds-item_label slds-text-color_weak slds-truncate" title="Time">Time:</dt>
                                    <dd class="slds-item_detail slds-truncate"><strong>{selectedSlot.time}</strong></dd>
                                </dl>
                            </div>
                            <div class="slds-col">
                                <dl class="slds-list_horizontal slds-wrap">
                                    <dt class="slds-item_label slds-text-color_weak slds-truncate" title="Agent">Agent:</dt>
                                    <dd class="slds-item_detail slds-truncate"><strong>{selectedSlot.agentName}</strong></dd>
                                </dl>
                            </div>
                            <div class="slds-col">
                                <dl class="slds-list_horizontal slds-wrap">
                                    <dt class="slds-item_label slds-text-color_weak slds-truncate" title="Customer">Customer:</dt>
                                    <dd class="slds-item_detail slds-truncate"><strong>{currentUserName}</strong></dd>
                                </dl>
                            </div>
                        </div>
                        <div class="slds-m-top_medium">
                            <p class="slds-text-color_weak">By confirming, you will book this time slot and email notifications will be sent to both you and the agent.</p>
                        </div>
                    </template>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button variant="neutral" label="Cancel" onclick={handleCloseModal} disabled={bookingInProgress}></lightning-button>
                    <lightning-button variant="brand" label="Confirm Booking" onclick={handleConfirmBooking} disabled={bookingInProgress}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
