<template>
    <lightning-card title="Volunteer Display">
        <!-- Statistics Toggle and Date Range -->
        <div class="slds-p-around_medium">
            <div class="slds-grid slds-gutters slds-grid_align-center">
                <div class="slds-col slds-size_1-of-4">
                    <lightning-input
                        type="checkbox"
                        label="Show Time Slot Statistics"
                        checked={showStatistics}
                        onchange={handleShowStatisticsChange}>
                    </lightning-input>
                </div>
                <template if:true={showStatistics}>
                    <div class="slds-col slds-size_1-of-4">
                        <lightning-input
                            type="date"
                            label="From"
                            value={fromDate}
                            onchange={handleFromDateChange}
                            required>
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-4">
                        <lightning-input
                            type="date"
                            label="To"
                            value={toDate}
                            onchange={handleToDateChange}
                            required>
                        </lightning-input>
                    </div>
                </template>
            </div>
        </div>
        
        <!-- Loading Spinner -->
        <template if:true={isLoading}>
            <div class="slds-align_absolute-center slds-p-around_large">
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </div>
        </template>
        
        <!-- Volunteers List -->
        <template if:false={isLoading}>
            <div class="slds-p-around_medium">
                <div class="slds-text-align_center slds-m-bottom_small">
                    <span class="slds-text-heading_small">Total Volunteers: {totalCount}</span>
                </div>
                
                <template if:true={hasVolunteers}>
                    <div class="slds-grid slds-gutters slds-wrap">
                        <template for:each={volunteers} for:item="volunteer">
                            <div key={volunteer.id} class="slds-col slds-size_1-of-3 slds-medium-size_1-of-2 slds-large-size_1-of-3">
                                <div class="slds-card slds-m-bottom_small">
                                    <div class="slds-card__body slds-card__body_inner">
                                        <div class="slds-text-heading_small slds-m-bottom_x-small">
                                            {volunteer.name}
                                        </div>
                                        <div class="slds-text-body_small slds-m-bottom_x-small">
                                            <lightning-formatted-email value={volunteer.email}></lightning-formatted-email>
                                        </div>
                                        <div class="slds-text-body_small slds-text-color_weak">
                                            <lightning-formatted-date-time 
                                                value={volunteer.createdDate}
                                                year="numeric"
                                                month="short"
                                                day="2-digit">
                                            </lightning-formatted-date-time>
                                        </div>
                                        
                                        <!-- Statistics -->
                                        <template if:true={showStatistics}>
                                            <template if:true={volunteer.statistics}>
                                                <div class="slds-m-top_small slds-p-top_small slds-border_top">
                                                    <div class="slds-text-body_small slds-text-heading_label">Time Slot Statistics</div>
                                                    <div class="slds-grid slds-gutters slds-m-top_x-small">
                                                        <div class="slds-col">
                                                            <div class="slds-text-body_small">
                                                                <span class="slds-text-color_success">Available: {volunteer.statistics.available}</span>
                                                            </div>
                                                        </div>
                                                        <div class="slds-col">
                                                            <div class="slds-text-body_small">
                                                                <span class="slds-text-color_error">Booked: {volunteer.statistics.booked}</span>
                                                            </div>
                                                        </div>
                                                        <div class="slds-col">
                                                            <div class="slds-text-body_small">
                                                                Total: {volunteer.statistics.total}
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </template>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
                
                <template if:false={hasVolunteers}>
                    <div class="slds-text-align_center slds-p-around_large">
                        <p class="slds-text-heading_medium">No volunteers found</p>
                    </div>
                </template>
            </div>
        </template>
    </lightning-card>
</template>
