<template>
    <lightning-card title="Appointment Request Upload">
        <div class="slds-p-around_medium">
            <lightning-button 
                label="Upload CSV" 
                variant="brand" 
                onclick={handleOpenModal}
                icon-name="utility:upload">
            </lightning-button>
        </div>
    </lightning-card>

    <!-- Modal -->
    <template if:true={showModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_medium" 
                 aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" 
                            title="Close" onclick={handleCloseModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">Upload CSV File</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <div class="slds-grid slds-grid_vertical slds-gutters">
                        <div class="slds-col">
                            <lightning-input 
                                type="file"
                                label="Select CSV File"
                                accept=".csv"
                                onchange={handleFileChange}
                                disabled={uploading}>
                            </lightning-input>
                            <template if:true={fileName}>
                                <div class="slds-m-top_small">
                                    <span class="slds-text-color_weak">Selected: {fileName}</span>
                                </div>
                            </template>
                        </div>
                        <div class="slds-col">
                            <div class="slds-box slds-theme_info">
                                <p class="slds-text-heading_small">CSV Format:</p>
                                <p class="slds-text-body_small">Expected columns: Agent Email (or Agent Id), Reference First Name, Reference Last Name, Reference Email</p>
                                <p class="slds-text-body_small slds-m-top_x-small">Note: Each row's Reference Email will receive an email with the calendar link.</p>
                                <p class="slds-text-body_small slds-m-top_x-small">Example:</p>
                                <pre class="slds-text-body_small">agent@example.com,John,Doe,john.doe@example.com</pre>
                            </div>
                        </div>
                    </div>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button variant="neutral" label="Cancel" onclick={handleCloseModal} disabled={uploading}></lightning-button>
                    <lightning-button variant="brand" label="Upload and Process" onclick={handleUpload} disabled={uploading}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
