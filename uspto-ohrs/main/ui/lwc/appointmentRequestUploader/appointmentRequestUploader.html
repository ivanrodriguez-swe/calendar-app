<template>
    <lightning-card title="References Upload">
        <div class="slds-p-around_medium">
            <lightning-button 
                label="Upload CSV" 
                variant="brand" 
                onclick={handleOpenModal}
                icon-name="utility:upload">
            </lightning-button>
        </div>
    </lightning-card>

    <!-- Modal -->
    <template if:true={showModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_medium" 
                 aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" 
                            title="Close" onclick={handleCloseModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">Upload CSV File</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <div class="slds-grid slds-grid_vertical slds-gutters">
                        <div class="slds-col">
                            <lightning-input 
                                type="file"
                                label="Select CSV File"
                                accept=".csv"
                                onchange={handleFileChange}
                                disabled={uploading}>
                            </lightning-input>
                            <template if:true={fileName}>
                                <div class="slds-m-top_small">
                                    <span class="slds-text-color_weak">Selected: {fileName}</span>
                                </div>
                            </template>
                        </div>
                        <div class="slds-col">
                            <div class="slds-box slds-theme_info">
                                <p class="slds-text-heading_small">CSV Format:</p>
                                <p class="slds-text-body_small">Expected columns:</p>
                                <ul class="slds-list_dotted slds-text-body_small">
                                    <li>Selectee Last Name, Selectee First Name, Selectee Email, Expected EOD (YYYY-MM-DD), Discipline</li>
                                    <li>Reference#1 Name, Reference#1 Email, Reference#1 Relationship</li>
                                    <li>Reference#2 Name, Reference#2 Email, Reference#2 Relationship</li>
                                    <li>Reference#3 Name, Reference#3 Email, Reference#3 Relationship</li>
                                </ul>
                                <p class="slds-text-body_small slds-m-top_x-small"><strong>Date format:</strong> Expected EOD must be in YYYY-MM-DD format (e.g., 2025-03-15)</p>
                                <p class="slds-text-body_small slds-m-top_x-small">Note: An Appointment Request record will be created for each reference listed on each row of the CSV file.</p>
                            </div>
                        </div>
                    </div>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button variant="neutral" label="Cancel" onclick={handleCloseModal} disabled={uploading}></lightning-button>
                    <lightning-button variant="brand" label="Upload and Process" onclick={handleUpload} disabled={uploading}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
